services:
  - type: web
    name: air-drawing-backend
    runtime: python
    repo: https://github.com/DevKacha/air-drawing-recognition
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
    disk:
      name: model-storage
      mountPath: /opt/render/project/src/model
      sizeGB: 1
